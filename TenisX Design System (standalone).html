  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

#5B8CFF;\n  --blue-lo:         #1E4FCC;\n\n  /* Electric cyan — the glow nodes. The signature TenisX accent. */\n  --cyan:            #2DE0FF;\n  --cyan-hi:         #7FF0FF;   /* node core / glow highlight */\n  --cyan-lo:         #15A8C8;\n  --ai-glow:         #BFFCFF;   /* near-white cyan, for halos */\n\n  /* Tennis volt — athletic accent, used RARELY (alerts, live, PRs) */\n  --volt:            #D6FF3D;\n  --volt-lo:         #A8CC1F;\n\n  /* ---------- NEUTRALS (cool, navy-tinted) ---------- */\n  --ink-950:         #080A11;\n  --ink-900:         #0C0F18;\n  --ink-850:         #11141F;   /* raised surface */\n  --ink-800:         #161A26;   /* card */\n  --ink-750:         #1B2030;\n  --ink-700:         #232838;   /* hairline / border */\n  --ink-600:         #333A4D;\n  --ink-500:         #5A6379;   /* disabled */\n  --ink-400:         #7A839A;   /* muted text */\n  --ink-300:         #9AA3B8;   /* secondary text */\n  --ink-200:         #C2C9D8;\n  --ink-100:         #E2E7F0;\n  --white:           #F5F8FF;\n\n  /* ---------- SEMANTIC SURFACES ---------- */\n  --bg:              var(--midnight-2);\n  --bg-elevated:     var(--ink-850);\n  --surface:         var(--ink-800);\n  --surface-2:       var(--ink-750);\n  --border:          var(--ink-700);\n  --border-strong:   var(--ink-600);\n  --border-glow:     rgba(45,224,255,0.35);\n\n  /* ---------- SEMANTIC TEXT ---------- */\n  --fg:              var(--white);\n  --fg-2:            var(--ink-300);\n  --fg-3:            var(--ink-400);\n  --fg-disabled:     var(--ink-500);\n  --fg-on-blue:      #FFFFFF;\n  --fg-on-volt:      #11140A;\n\n  /* ---------- SEMANTIC ACCENTS ---------- */\n  --accent:          var(--cyan);       /* signature / connectivity */\n  --action:          var(--blue);       /* primary interactive */\n  --positive:        #2FD98B;           /* win / available */\n  --warning:         var(--volt);       /* live / attention */\n  --negative:        #FF5C6B;           /* loss / error */\n\n  /* ---------- GRADIENTS & GLOW ---------- */\n  --grad-court:      linear-gradient(135deg, #0F2A57 0%, #081427 60%, #080A11 100%);\n  --grad-signal:    linear-gradient(90deg, var(--blue) 0%, var(--cyan) 100%);\n  --grad-node:      radial-gradient(circle, var(--cyan-hi) 0%, var(--cyan) 35%, rgba(45,224,255,0) 70%);\n  --glow-cyan:       0 0 0 1px rgba(45,224,255,0.4), 0 0 24px -4px rgba(45,224,255,0.55);\n  --glow-blue:       0 0 24px -6px rgba(45,107,255,0.65);\n\n  /* ---------- TYPE FAMILIES ---------- */\n  --font-display: 'Space Grotesk', system-ui, sans-serif; /* headings, hero, big numbers */\n  --font-sans:    'Manrope', system-ui, sans-serif;       /* body + UI */\n  --font-mono:    'JetBrains Mono', ui-monospace, monospace; /* labels, telemetry, data */\n\n  /* ---------- TYPE SCALE (display-first, mobile-aware) ---------- */\n  --t-display:  clamp(2.6rem, 6vw, 4.5rem);   /* hero */\n  --t-h1:       2.25rem;   /* 36 */\n  --t-h2:       1.75rem;   /* 28 */\n  --t-h3:       1.375rem;  /* 22 */\n  --t-h4:       1.125rem;  /* 18 */\n  --t-body:     1rem;      /* 16 */\n  --t-sm:       0.875rem;  /* 14 */\n  --t-xs:       0.75rem;   /* 12 */\n  --t-eyebrow:  0.6875rem; /* 11 — mono label */\n\n  /* ---------- WEIGHTS ---------- */\n  --w-light: 400; --w-med: 500; --w-semi: 600; --w-bold: 700; --w-black: 800;\n\n  /* ---------- TRACKING ---------- */\n  --track-eyebrow: 0.18em;  /* wide mono labels */\n  --track-display: -0.02em; /* tight display */\n  --track-tight:   -0.01em;\n\n  /* ---------- RADII ---------- */\n  --r-xs: 6px;\n  --r-sm: 10px;\n  --r-md: 14px;\n  --r-lg: 20px;\n  --r-xl: 28px;\n  --r-pill: 999px;\n\n  /* ---------- SPACING (4px base) ---------- */\n  --s-1: 4px;  --s-2: 8px;  --s-3: 12px; --s-4: 16px;\n  --s-5: 20px; --s-6: 24px; --s-8: 32px; --s-10: 40px;\n  --s-12: 48px; --s-16: 64px; --s-20: 80px;\n\n  /* ---------- ELEVATION ---------- */\n  --e-0: none;\n  --e-1: 0 1px 2px rgba(0,0,0,0.4);\n  --e-2: 0 4px 16px -4px rgba(0,0,0,0.5);\n  --e-3: 0 12px 40px -8px rgba(0,0,0,0.6);\n  --e-card: inset 0 1px 0 rgba(255,255,255,0.04), 0 8px 30px -12px rgba(0,0,0,0.7);\n\n  /* ---------- MOTION ---------- */\n  --ease-signal: cubic-bezier(0.22, 1, 0.36, 1);  /* smooth, premium settle */\n  --ease-snap:   cubic-bezier(0.34, 1.56, 0.64, 1);\n  --t-fast: 140ms; --t-base: 220ms; --t-slow: 420ms;\n}\n\n/* ============================================================\n   SEMANTIC ELEMENT DEFAULTS\n   ============================================================ */\n.tx-eyebrow {\n  font-family: var(--font-mono);\n  font-size: var(--t-eyebrow);\n  font-weight: var(--w-med);\n  letter-spacing: var(--track-eyebrow);\n  text-transform: uppercase;\n  color: var(--cyan);\n}\n.tx-display {\n  font-family: var(--font-display);\n  font-size: var(--t-display);\n  font-weight: var(--w-bold);\n  letter-spacing: var(--track-display);\n  line-height: 0.98;\n  color: var(--fg);\n}\n.tx-h1 { font-family: var(--font-display); font-size: var(--t-h1); font-weight: var(--w-bold); letter-spacing: var(--track-display); line-height: 1.05; color: var(--fg); }\n.tx-h2 { font-family: var(--font-display); font-size: var(--t-h2); font-weight: var(--w-semi); letter-spacing: var(--track-tight); line-height: 1.1; color: var(--fg); }\n.tx-h3 { font-family: var(--font-display); font-size: var(--t-h3); font-weight: var(--w-semi); line-height: 1.2; color: var(--fg); }\n.tx-h4 { font-family: var(--font-sans); font-size: var(--t-h4); font-weight: var(--w-bold); line-height: 1.3; color: var(--fg); }\n.tx-body { font-family: var(--font-sans); font-size: var(--t-body); font-weight: var(--w-med); line-height: 1.6; color: var(--fg-2); }\n.tx-sm { font-family: var(--font-sans); font-size: var(--t-sm); font-weight: var(--w-med); line-height: 1.5; color: var(--fg-2); }\n.tx-data { font-family: var(--font-mono); font-weight: var(--w-med); font-variant-numeric: tabular-nums; color: var(--fg); }\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;margin:0;padding:0}\n  html{scroll-behavior:smooth}\n  body{background:var(--bg);color:var(--fg);font-family:var(--font-sans);-webkit-font-smoothing:antialiased}\n  .wrap{max-width:1080px;margin:0 auto;padding:0 28px}\n  section{padding:64px 0;border-top:1px solid var(--border)}\n  .eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:14px}\n  h2{font-family:var(--font-display);font-weight:700;font-size:34px;letter-spacing:-.02em;margin-bottom:6px}\n  .sub{font-family:var(--font-sans);font-size:15px;color:var(--fg-2);max-width:620px;line-height:1.6;margin-bottom:34px}\n  .grid{display:grid;gap:14px}\n  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px -14px rgba(0,0,0,.8)}\n  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--fg-3)}\n  .sw{border-radius:14px;border:1px solid var(--border);display:flex;flex-direction:column;justify-content:flex-end;padding:14px;min-height:120px;position:relative;overflow:hidden}\n  .sw .n{font-family:var(--font-sans);font-weight:700;font-size:14px;text-shadow:0 1px 3px rgba(0,0,0,.5)}\n  .sw .h{font-family:var(--font-mono);font-size:11px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.5)}\n  .btn{font-family:var(--font-sans);font-weight:700;font-size:14px;border-radius:12px;padding:12px 20px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}\n  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;padding:6px 12px;border-radius:999px;border:1px solid var(--border);text-transform:uppercase}\n  .node{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px 1px rgba(45,224,255,.8);display:inline-block}\n  nav{position:sticky;top:0;z-index:50;background:rgba(12,15,24,.82);backdrop-filter:blur(14px);border-bottom:1px solid var(--border)}\n  nav .wrap{display:flex;align-items:center;gap:22px;height:60px}\n  nav a{font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);text-decoration:none}\n  nav a:hover{color:var(--fg)}\n  .navmark{height:26px;display:flex;align-items:center;gap:9px;margin-right:auto}\n  .navmark img{height:22px}\n<\u002Fstyle><\u002Fhead>\n<body>\n<nav><div class=\"wrap\">\n  <span class=\"navmark\"><span style=\"width:26px;height:30px;display:inline-block\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 142\" style=\"width:100%;height:100%;display:block;overflow:visible\">\n<defs>\n<linearGradient id=\"cChrome\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#FFFFFF\"><\u002Fstop><stop offset=\".5\" stop-color=\"#CBD3E0\"><\u002Fstop><stop offset=\"1\" stop-color=\"#828AA0\"><\u002Fstop><\u002FlinearGradient>\n<radialGradient id=\"cGlow\"><stop offset=\"0\" stop-color=\"#BFFCFF\"><\u002Fstop><stop offset=\".42\" stop-color=\"#2DE0FF\"><\u002Fstop><stop offset=\"1\" stop-color=\"#2DE0FF\" stop-opacity=\"0\"><\u002Fstop><\u002FradialGradient>\n<\u002Fdefs><polygon points=\"20.3,29.5 34.7,29.5 34.7,10.5 20.3,10.5\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"39.3,29.5 53.7,29.5 53.7,10.5 39.3,10.5\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"58.3,29.5 72.7,29.5 72.7,10.5 58.3,10.5\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"77.3,29.5 91.7,29.5 91.7,10.5 77.3,10.5\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"39.1,65.9 53.4,80.2 68.2,65.4 53.9,51.1\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"58.4,85.3 72.7,99.6 87.6,84.7 73.3,70.4\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"77.8,104.6 92.1,118.9 106.9,104.1 92.6,89.8\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"92.1,51.1 77.8,65.4 92.6,80.2 106.9,65.9\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"72.7,70.4 58.4,84.7 73.3,99.6 87.6,85.3\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"53.4,89.8 39.1,104.1 53.9,118.9 68.2,104.6\" fill=\"url(#cChrome)\"><\u002Fpolygon><circle cx=\"44\" cy=\"56\" r=\"8.5\" fill=\"url(#cGlow)\"><\u002Fcircle><circle cx=\"44\" cy=\"56\" r=\"2.3\" fill=\"#E6FFFF\"><\u002Fcircle><circle cx=\"102\" cy=\"56\" r=\"8.5\" fill=\"url(#cGlow)\"><\u002Fcircle><circle cx=\"102\" cy=\"56\" r=\"2.3\" fill=\"#E6FFFF\"><\u002Fcircle><circle cx=\"44\" cy=\"114\" r=\"8.5\" fill=\"url(#cGlow)\"><\u002Fcircle><circle cx=\"44\" cy=\"114\" r=\"2.3\" fill=\"#E6FFFF\"><\u002Fcircle><circle cx=\"102\" cy=\"114\" r=\"8.5\" fill=\"url(#cGlow)\"><\u002Fcircle><circle cx=\"102\" cy=\"114\" r=\"2.3\" fill=\"#E6FFFF\"><\u002Fcircle><polygon points=\"46.5,22.3 46.5,35.4 65.5,35.4 65.5,22.3\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"46.5,40.0 46.5,53.0 65.5,53.0 65.5,40.0\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"46.5,57.6 46.5,70.7 65.5,70.7 65.5,57.6\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"46.5,75.3 46.5,88.4 65.5,88.4 65.5,75.3\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"46.5,93.0 46.5,106.0 65.5,106.0 65.5,93.0\" fill=\"url(#cChrome)\"><\u002Fpolygon><polygon points=\"46.5,110.6 46.5,123.7 65.5,123.7 65.5,110.6\" fill=\"url(#cChrome)\"><\u002Fpolygon><\u002Fsvg><\u002Fspan><span style=\"font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:-.01em\">TenisX<\u002Fspan><\u002Fspan>\n  <a href=\"#brand\">Brand<\u002Fa><a href=\"#color\">Color<\u002Fa><a href=\"#type\">Type<\u002Fa><a href=\"#space\">Spacing<\u002Fa><a href=\"#comp\">Components<\u002Fa>\n<\u002Fdiv><\u002Fnav>\n\n<!-- HERO -->\n<header class=\"wrap\" style=\"padding:88px 28px 56px;text-align:center\">\n  <div class=\"eyebrow\" style=\"justify-content:center\">The Operating System for Tennis<\u002Fdiv>\n  <h1 style=\"font-family:var(--font-display);font-weight:700;font-size:clamp(2.6rem,6vw,4.4rem);letter-spacing:-.03em;line-height:.98\">The design language<br>of connected tennis.<\u002Fh1>\n  <p style=\"font-family:var(--font-sans);font-size:17px;color:var(--fg-2);max-width:560px;margin:22px auto 0;line-height:1.6\">A dark-first, AI-native system derived from the TenisX logo — segmented chrome, circuit traces, and glowing nodes that imply everything in tennis is connected.<\u002Fp>\n  <div style=\"display:flex;justify-content:center;gap:14px;margin-top:32px\">\n    <span class=\"chip\" style=\"color:var(--cyan);border-color:rgba(45,224,255,.4)\"><span class=\"node\"><\u002Fspan>v1.0 · DARK<\u002Fspan>\n    <span class=\"chip\">SPACE GROTESK · MANROPE · JETBRAINS MONO<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- BRAND -->\n<section id=\"brand\"><div class=\"wrap\">\n  <div class=\"eyebrow\">01 · Brand<\u002Fdiv><h2>Logo &amp; app icon<\u002Fh2>\n  <p class=\"sub\">The wordmark pairs a clean humanist set with the technological segmented X. The X — chrome packets crossing through illuminated nodes — is the seed of the whole system.<\u002Fp>\n  <div class=\"grid\" style=\"grid-template-columns:1.4fr 1fr\">\n    <div class=\"card\" style=\"display:flex;align-items:center;justify-content:center;background:#0a0c12;min-height:220px\"><img src=\"ba6ab151-215c-4673-ba96-0c8c25c9d41d\" style=\"max-width:78%;max-height:150px;object-fit:contain\"><\u002Fdiv>\n    <div class=\"card\" style=\"display:flex;align-items:center;justify-content:center;gap:22px;background:linear-gradient(155deg,#161a28,#0a0c12 72%)\">\n      <div style=\"width:120px;height:120px;border-radius:28px;background:#0a0c12;border:1px solid var(--border);position:relative;box-shadow:0 14px 36px -12px rgba(0,0,0,.8)\"><div style=\"position:absolute;left:16px;right:16px;top:11px;bottom:6px\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 142\" style=\"width:100%;height:100%;display:block;overflow:visible\">\n<defs>\n<linearGradient id=\"cChrome\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop o
