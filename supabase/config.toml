
project_id = "hqqlrliakttqsbalvuyz"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["http://localhost:8081/reset-password", "tenisxnative://reset-password"]
jwt_expiry = 3600
jwt_secret = "super-secret-jwt-token-with-at-least-32-characters-long"

[auth.email]
enable_signup = true
enable_confirmations = true
max_frequency = "1m0s"

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 465
user = "resend"
pass = "env(RESEND_SMTP_PASSWORD)"
admin_email = "noreply@tenisx.ai"
sender_name = "TenisX"

[auth.email.template.recovery]
subject = "Reset Your Password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.confirmation]
subject = "Welcome to TenisX — confirm your email"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.invite]
subject = "You've been invited to TenisX"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your TenisX Sign-In Link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.email_change]
subject = "Confirm Your New Email Address"
content_path = "./supabase/templates/email_change.html"

[auth.hook.send_email]
enabled = false
uri = "http://localhost:54321/functions/v1/send-auth-email"
secrets = "v1,whsec_bG9jYWxkZXZzZWNyZXRrZXlmb3JjbGF1ZGU="

[functions.send-booking-email]
verify_jwt = true

[functions.send-auth-email]
verify_jwt = false

[functions.send-scheduled-reminders]
verify_jwt = false
